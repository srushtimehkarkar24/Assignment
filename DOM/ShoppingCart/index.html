<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart Calculator</title>

  <!-- Link CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Shopping Cart</h2>

  <div class="item">
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" min="0" value="0">
  </div>

  <div class="total">
    Total Price: ₹<span id="totalPrice">0.00</span>
  </div>

  <!-- Link JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
